name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The test runner uses `node --experimental-strip-types`, which needs Node >= 22.6.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Regenerating the demo must be a no-op — the committed artifact stays in sync.
      - run: npm run demo && git diff --exit-code examples/
